# The pull-request gate — once branch protection points at the `Vérifications`
# job below, which is a GitHub setting and NOT something this file can assert.
# Until it does, this workflow reports and blocks nothing. `docs/deploiement.md`
# carries the exact `gh api` calls.
#
# What it defends that a human reviewer cannot see in a diff:
#
# - `test:build` reads `.next/prerender-manifest.json` and refuses a build where
#   `/fr` or `/_not-found` stopped being prerendered. That breakage exits 0 and
#   prints `✓ Generating static pages`, so it is invisible everywhere else.
# - the same suite weighs the initial JavaScript of `/fr` in brotli against a
#   150 KB ceiling. A client-side map library added "just to try" fails here.
# - `test:lint` proves the `src/domain` purity rule still refuses something. It
#   has silently stopped refusing twice already, in a single ticket.
# - `validate:content` refuses a trip whose YAML the pages could not load.
# - `check:photo-weight` refuses a repository whose tracked images pass 150 MB.
#   Every clone and every build pay that weight, and git never gives it back.
# - since TIW-26, `test:perf` measures LCP and CLS on a throttled mobile profile
#   and refuses a median past 2.5 s or 0.1. It also PUBLISHES the numbers to the
#   run summary, green or red: a ceiling answers pass/fail and never answers how
#   much room the next ticket has.
# - and the end-to-end job gained four guards no build output can carry: nothing is
#   requested off this origin on load, the heading outline of the four screens is
#   well formed (axe's own rule for that is `best-practice`, so the WCAG-tagged
#   audits do not run it — measured), the whole keyboard journey is walkable with
#   `Tab` alone, and the site is usable with JavaScript switched off.
#
# See `docs/deploiement.md` for what this pipeline does NOT gate (preview
# deployments) and why, and for the branch-protection settings that turn a red
# run into a blocked merge.
#
# The workflow is named `CI` and the aggregate job `Vérifications`, deliberately
# different: the job name is what GitHub reports as the status-check context, and
# what branch protection is configured with. Two identical names there make the
# required-check picker ambiguous.
name: CI

on:
  pull_request:
  # Integration branches are verified after the merge too: two pull requests can
  # each be green on their own head and red once merged into each other.
  push:
    branches: [main, develop]

# Read the code, and nothing else. This pipeline publishes nothing, comments on
# nothing and writes to no branch.
permissions:
  contents: read

concurrency:
  # A new push on a pull request makes the previous run's answer worthless — the
  # code it judged no longer exists. Runs on `main` and `develop` are never
  # cancelled: those are the record of what the integration branch is worth.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Next prints a telemetry notice on a runner where no human can answer it, and
  # sends a request per build from an IP that means nothing. Both are noise.
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Everything that needs no build. ~20 s of work locally, so it is the job that
  # tells you first that a pull request is broken.
  checks:
    name: Lint, types, contenu, tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from `.nvmrc`, never written here: a hardcoded version is a
          # second source of truth that drifts from `engines` and from the
          # runtime configured on Vercel, silently, until something breaks.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # `pretest` runs this too, a second later. It is worth the 0.3 s to run it
      # as its own step: a broken trip then shows up as a red `validate:content`
      # naming the file, the line and the command to run, instead of scrolling
      # past in the prelude of `npm run test`.
      - run: npm run validate:content

      - run: npm run test

      - run: npm run test:lint

      # The repository's own weight, which is the one budget that grows without
      # anyone deciding to spend it: every clone pays it, every job here pays it,
      # and the platform pays it again on each build because a build starts from a
      # clone. Past 150 MB the answer is external storage and an absolute `src`,
      # which is a content change and not a structural one — so this can afford to
      # fail rather than warn. It asks git what is tracked, so it costs ~0.2 s and
      # needs no build. Proven by deliberate failure: a 160 MB file staged under
      # `public/photos/` exits 1 and names the file.
      - run: npm run check:photo-weight

  # The build and the two guards that can only be read off its artefacts. One
  # job, not two: `test:build` asserts on `.next/`, so it must run on the same
  # filesystem as the build that produced it.
  build:
    name: Build, prérendu et budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Never `continue-on-error`, never skipped: this is the only automated
      # check of the project's central invariant. Without it the prerendering can
      # disappear while the build stays green.
      - run: npm run test:build

  # Playwright, against a production build it makes itself — its `webServer` runs
  # `npm run build && npm run start` with `reuseExistingServer: false`, and the
  # comment in `playwright.config.ts` explains why that is deliberate: with reuse
  # on, the suite once attached to a stray dev server and passed green against
  # development HTML, with no build at all.
  #
  # So this job builds a second time, and that is the cheaper option. It runs
  # ALONGSIDE `build`, not after it, so the second build costs runner time (free,
  # public repository) and nothing at all in feedback latency. The alternatives
  # both cost more: appending these steps to `build` would pay the two builds in
  # series, and handing Playwright a pre-built server would mean weakening
  # `reuseExistingServer: false` — trading a proven guard for ~40 s.
  #
  # Since TIW-17 this job makes TWO builds of its own, and the second is not
  # redundancy either: the photo viewer can only be exercised on a trip page that
  # has photographs, and `content/trips` is empty until TIW-24 — which the specs
  # here assert, deliberately, because it is what production serves.
  #
  # These three lines used to say the fixture build went to a `distDir` of its own
  # through `TIW_DIST_DIR`. Measured while writing TIW-26: **that variable does not
  # exist anywhere in this repository** — not in `next.config.ts`, not in either
  # Playwright config, not in `src/`. The shape it describes was considered and
  # dropped, and `playwright.content.config.ts` says why in its own header: a second
  # top-level build directory is walked by `eslint .`, whose flat config does not
  # read `.gitignore`. Both configs therefore build the **default** `.next`, in
  # sequence, and `package.json` fixes the order so the one left on disk is the
  # repository's own. On this runner the question is moot anyway: `build` and
  # `test:build` are a different job with a different checkout.
  #
  # What DOES deserve to be shared between runs is the browser download, below.
  e2e:
    name: Playwright (build de production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The cache key must be the Playwright version, not the lockfile hash: the
      # browser build a given Playwright expects is pinned to that version, and a
      # cache serving the wrong one is a flake nobody traces back to here. Read
      # from the installed package, so it cannot drift from what will run.
      - name: Resolve the installed Playwright version
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Chromium only: `playwright.config.ts` declares that single project.
      #
      # Two steps, not one, and this is the subtlety of caching Playwright: the
      # browser lives in `~/.cache/ms-playwright` and is cached, but the system
      # libraries `--with-deps` installs are apt packages on the runner image and
      # are NOT. A cache hit therefore still needs `install-deps`, or Chromium
      # starts and immediately dies on a missing shared object.
      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install only the system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      - name: Upload the Playwright report
        # Only when red — a green run's report is 200 KB nobody opens. `trace:
        # on-first-retry` means a flaky test leaves its trace in here.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # TIW-26's performance measurement: Largest Contentful Paint and Cumulative
  # Layout Shift on the home page and on a trip page, under a throttled mobile
  # profile (CPU x4, Slow 4G), on a build of the end-to-end fixture.
  #
  # A JOB OF ITS OWN, and the two reasons are in `tests/perf/playwright.perf.config.ts`
  # at length. In short: `workers: 1`, because a sample taken while three other
  # Chromiums share the runner measures the runner; and legibility, because a red
  # `Performance` says "the site got slower" where the same failure inside the
  # Playwright job says "the end-to-end suite is broken".
  #
  # IT BLOCKS, deliberately, and here is the reasoning rather than the habit. A
  # threshold on a shared runner is the classic flaky guard, so three things make
  # this one safe to require: each case is the MEDIAN of five cold loads, so one
  # hiccup is absorbed inside the case; the margin is large — measured locally at
  # 464 ms and 588 ms against a 2500 ms ceiling, and 0.0000 against 0.1 — so the
  # threshold is nowhere near the measurement; and one retry covers the other kind
  # of event, a runner descheduled for two seconds, which ruins all five samples at
  # once and has nothing to do with the code. A real regression is reproducible and
  # fails twice.
  #
  # AND IT PUBLISHES. The suite writes its per-sample table to the job log and to
  # `$GITHUB_STEP_SUMMARY`, because pass/fail does not answer "how close are we",
  # which is the question that decides whether the next ticket has room. The
  # numbers are on the run's summary page whether it is green or red.
  perf:
    name: Performance (LCP et CLS, mobile bridé)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The same two-step browser cache as the job above, for the same measured
      # reason: `~/.cache/ms-playwright` is cacheable and the apt packages
      # `--with-deps` installs are not, so a cache hit still needs `install-deps`
      # or Chromium dies on a missing shared object.
      - name: Resolve the installed Playwright version
        id: playwright
        run: |
          version="$(node -p "require('@playwright/test/package.json').version")"
          echo "Playwright $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install only the system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:perf

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-perf
          path: playwright-report/
          retention-days: 7

  # The single check name branch protection points at.
  #
  # Without it, protection has to list every job by name, and the day a job is
  # added it is advisory until someone remembers to make it required — a new
  # guard that guards nothing, which is the failure mode this repository already
  # documents twice. `needs: [...]` here is the list, and it lives in the repo.
  verify:
    name: Vérifications
    needs: [checks, build, e2e, perf]
    # `always()`, otherwise this job is skipped when a dependency fails — and a
    # skipped required check is reported as neutral, not as a failure.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse unless every job succeeded
        # Through the environment, not interpolated into the script: expression
        # output is never pasted straight into a shell here.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats des jobs : $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::une vérification n'est pas passée ($RESULTS)"
              exit 1
            fi
          done
