      lat: 45.90878
      lon: 6.12565

  - slug: paris
    name: Paris
    countryCode: FR
    coordinates:
      lat: 48.85341
      lon: 2.3488

  # En Corse, donc « FR » : le fond de carte n'a qu'une forme à teindre.
  - slug: porticcio
    name: Porticcio
    countryCode: FR
    coordinates:
      lat: 41.88682
      lon: 8.80271

  - slug: barcelone
    name: Barcelone
    countryCode: ES
    coordinates:
      lat: 41.38879
      lon: 2.15899

  # Nom officiel catalan ; le client l'avait donnée sous son nom castillan, Rosas.
  - slug: roses
    name: Roses
    countryCode: ES
    coordinates:
      lat: 42.26199
      lon: 3.17689

  # Valence est aussi une ville française. Celle-ci est en Espagne — València —
  # et c'est le countryCode qui le dit : « npm run geocode:places » compare le
  # pays renvoyé par le service à celui écrit ici, et n'écrit rien s'ils diffèrent.
  - slug: valence
    name: Valence
    countryCode: ES
    coordinates:
      lat: 39.47391
      lon: -0.37966

  - slug: heraklion
    name: Héraklion
