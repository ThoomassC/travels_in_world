# publication et chaque étape — et elles ne disent RIEN de quand ce voyage a eu
# lieu.
#
# COMMENT LES RECONNAÎTRE SANS LIRE CE COMMENTAIRE : les voyages provisoires
# commencent tous le PREMIER du mois, et portent tous la même date de publication
# (2026-09-07). Treize départs le 1er est une coïncidence que la réalité ne produit
# pas : c'est le marqueur, et il disparaît au fur et à mesure que les vraies dates
# arrivent. La liste complète est dans content/DATES-FICTIVES.md.
#
# Le récit n'est pas écrit : « story: unwritten » en fin de fichier. Le voyage est
# donc sur la carte et dans les listes, sa fiche dit « Récit à venir », et il n'a
# pas de page. Aucune photo n'a été fournie : photos est vide.

