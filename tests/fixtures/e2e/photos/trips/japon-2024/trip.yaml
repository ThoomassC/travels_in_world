# Le voyage que la suite Playwright ouvre pour éprouver la visionneuse photo.
#
# Il vit ici et pas dans content/trips/ parce que le contenu réel est vide jusqu'à
# TIW-24, et parce que les autres specs E2E asseoient délibérément l'état vide de
# /fr. La suite « photos » a donc son propre serveur, son propre distDir et ce
# dossier ; voir playwright.config.ts.
#
# Quatre photos, et chacune est là pour un cas :
#   tokyo  — la couverture, donc exclue de la galerie
#   kyoto  — rattachée à un lieu, donc rendue dans l'étape de ce lieu
#   osaka  — sans rattachement, donc dans la galerie du voyage
#   nara   — idem, pour que la galerie ait deux entrées et que « suivant » ait
#            quelque part où aller
slug: japon-2024
title: Japon, printemps 2024
startDate: 2024-04-12
endDate: 2024-04-20

